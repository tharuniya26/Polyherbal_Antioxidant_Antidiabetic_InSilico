# Polyherbal Antidiabetic In-Silico Research
# Original research report date: 2026-08-11
# Researcher: Tharuniya Anpalakan
#
# Source: Final-year Biomedical Science research report
# Section 3.0 and Appendix 3
#
# Ratios refer to aqueous leaf extract proportions.
# They do NOT represent measured concentrations
# of individual phytochemical compounds.

project:
  name: "Polyherbal Antidiabetic In-Silico Research"
  original_research_date: "2026-08-11"
  institution: "Northumbria University"
  department: "Department of Applied Sciences"
  researcher: "Tharuniya Anpalakan"

plants:
  AM: "Aegle marmelos"
  BD: "Boerhavia diffusa"
  SA: "Senna auriculata"
  SR: "Salacia reticulata"
  VN: "Vitex negundo"

formulations:
  combination_1:
    description: "Equal weighting of TPC, TFC and TAC"
    ratio:
      AM: 2.0
      BD: 1.5
      SA: 2.0
      SR: 2.0
      VN: 2.5

  combination_2:
    description: "Greater emphasis on TAC"
    weights:
      TPC: 0.25
      TFC: 0.25
      TAC: 0.50
    ratio:
      AM: 2.0
      BD: 1.0
      SA: 2.5
      SR: 2.0
      VN: 2.5

  combination_3:
    description: "Selected plants with higher antioxidant-related measurements"
    ratio:
      SA: 3.5
      SR: 3.5
      VN: 3.0

experimental_assays:
  phytochemical:
    - "Qualitative phytochemical screening"
    - "Total phenolic content (TPC)"
    - "Total flavonoid content (TFC)"
    - "Total antioxidant capacity (TAC)"

  antioxidant:
    - "DPPH radical scavenging"
    - "ABTS radical scavenging"

  glucose_related:
    - "Glucose adsorption"
    - "Yeast glucose uptake"